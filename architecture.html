<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture Diagrams — NoiseMap NYC</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffffff;
            --bg2: #f8f9fc;
            --bg3: #e8eeff;
            --border: #e4e8f0;
            --text: #1e2235;
            --text2: #4a5270;
            --text3: #9aa0b8;
            --accent: #1a4ff0;
            --accent-soft: #dce6ff;
            --accent-border: #99b4ff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 0 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }

        .nav-logo {
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .nav-logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text3);
            text-decoration: none;
            transition: color 0.15s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .wrap {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .hero {
            padding: 64px 0 48px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
        }

        .hero-tag {
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: 14px;
        }

        .hero h1 {
            font-family: Arial, sans-serif;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.1;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero-sub {
            font-size: 14px;
            color: var(--text3);
            font-family: monospace;
        }

        .section {
            padding: 24px 0 24px;
            scroll-margin-top: 70px;
        }

        .img-wrap {
            border: 1px solid #eee;
            border-radius: 0; /* Completely square corners to prevent clipping */
            overflow: visible;
            padding: 0;
            margin-bottom: 20px;
        }

        .img-wrap img {
            width: 100%;
            display: block;
        }

        .section-label {
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--accent-border);
            display: block;
        }

        p {
            font-size: 15px;
            color: var(--text2);
            line-height: 1.9;
            margin-bottom: 14px;
            text-align: justify;
        }

        .dropdown {
            position: relative;
        }

        .dropbtn {
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: -100px;
            background: white;
            min-width: 220px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .dropdown-content a {
            display: block;
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text2);
            text-decoration: none;
            font-family: Arial, sans-serif;
        }

        .dropdown-content a:hover {
            background: var(--bg2);
            color: var(--accent);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body id="top">

    <nav>
        <div class="nav-logo">
            NoiseMap <span>NYC</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Requirements</a>

            <div class="dropdown">
                <a href="proposal.html" class="dropbtn">Proposal</a>
                <div class="dropdown-content">
                    <a href="proposal.html#Problem">Problem Statement</a>
                    <a href="proposal.html#objective">Objectives</a>
                    <a href="proposal.html#Related">Related Works</a>
                    <a href="proposal.html#approach">Proposed Approach</a>
                    <a href="proposal.html#data">Data Sources</a>
                    <a href="proposal.html#features">Features</a>
                </div>
            </div>

            <a href="uml.html">UML</a>
        </div>
    </nav>

    <div class="wrap">

        <div class="hero">
            <div class="hero-tag">PBL3 · Group G</div>
            <h1>System Architecture Diagram <span>Diagrams</span></h1>
          
        </div>

        <div class="section">
            <span class="section-label">Deployment Architecture Diagram</span>
            <div class="img-wrap" style="margin-bottom:0; border-radius:0;">
                <img src="arc/deployment.svg">
            </div>
        </div>

        <div class="section">
            <span class="section-label">Activity Diagram</span>
            <div class="img-wrap" style="margin-bottom:30px; border-radius:0;">
                <img src="uml/activity.svg">
            </div>
            <div class="img-wrap" style="margin-bottom:0; border-radius:0;">
                <img src="uml/sub.svg">
            </div>
        </div>

      

    </div>

</body>
</html>
